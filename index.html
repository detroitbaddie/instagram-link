
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Opening Browser...</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 30px;
    }

    h1 {
      font-size: 26px;
    }

    p {
      color: #ccc;
      line-height: 1.6;
    }

    button {
      background: #ff2d8d;
      color: white;
      border: none;
      border-radius: 30px;
      padding: 16px 30px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    .instructions {
      display: none;
      margin-top: 25px;
    }

    a {
      color: #ff75b6;
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>Opening Your Browser...</h1>

    <p id="status">
      Redirecting you to the page.
    </p>

    <button onclick="openBrowser()">
      Open in Browser
    </button>

    <div class="instructions" id="instructions">
      <p>
        If you're still inside Instagram,
        tap the three dots (•••) and
        choose "Open in external browser."
      </p>

      <p>
        <a href="https://tinyurl.com/detroitbaddie">
          Continue to website
        </a>
      </p>
    </div>

  </div>

<script>
const destination =
  "https://tinyurl.com/detroitbaddie";

const userAgent = navigator.userAgent || "";

const isInstagram =
  /Instagram/i.test(userAgent);

const isAndroid =
  /Android/i.test(userAgent);

const isIOS =
  /iPhone|iPad|iPod/i.test(userAgent);

function showInstructions() {
  document.getElementById(
    "instructions"
  ).style.display = "block";

  document.getElementById(
    "status"
  ).textContent =
    "If your browser did not open, " +
    "follow the instructions below.";
}

function openBrowser() {

  if (!isInstagram) {
    window.location.href = destination;
    return;
  }

  if (isAndroid) {

    const cleanURL =
      destination.replace(/^https?:\/\//, "");

    const intentURL =
      "intent://" + cleanURL +
      "#Intent;" +
      "scheme=https;" +
      "package=com.android.chrome;" +
      "S.browser_fallback_url=" +
      encodeURIComponent(destination) +
      ";end";

    window.location.href = intentURL;

  } else if (isIOS) {

    // Experimental Safari URL scheme.
    // Instagram may block this attempt.
    window.location.href =
      "x-safari-" + destination;

  } else {
    window.location.href = destination;
  }

  setTimeout(showInstructions, 1500);
}

window.addEventListener("load", () => {

  if (!isInstagram) {
    window.location.replace(destination);
  } else {
    setTimeout(openBrowser, 500);
  }

});
</script>

</body>
</html>
