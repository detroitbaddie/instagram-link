
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"

<meta name="theme-color" content="#ffffff">
<title>DETROITBADDIE</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #ffffff;
  color: #111111;

.banner {

}

.profile {

    );

  background-position: center;
}

h1 {
  margin: 0 0 55px;

  font-weight: 900;
  letter-spacing: -1.5px;
}

.button {
  display: inline-block;
  padding: 18px 40px;
  background: #8994ed;
  color: white;
  border: none;
  border-radius: 40px;
  font-size: 17px;
  font-weight: 800;
  text-decoration: none;
  cursor: pointer;
}

.button:active {
  transform: scale(0.98);
}

footer {
  padding: 55px 15px;
  text-align: center;
  color: #aaaaaa;
  font-size: 12px;
  letter-spacing: 2px;
}
</style>
</head>
